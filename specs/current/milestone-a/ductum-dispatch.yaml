    - name: P8-ADP-EXPORT
      target: qratum
      repos:
        - /Users/acartagena/project/qratum
      assignedAgent: gpt-5-5
      requiredRole: builder
      complexity: standard
      depends_on: [P7-HTML-REPORT]
      verification:
