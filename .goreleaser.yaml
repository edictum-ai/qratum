version: 2

project_name: qratum

builds:
  - main: ./cmd/qrt
    binary: qrt
    env:
      - CGO_ENABLED=0
    # Unix-only: the vault uses syscall.Flock (capture lock) and syscall.Statfs
    # (disk-free guard), which have no Windows equivalents. Windows support would
    # need build-tagged platform implementations — deferred.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: acartag7
    name: qratum
  draft: false
  prerelease: auto

# Publish a Homebrew formula to the personal Homebrew tap on each release.
# `brew install acartag7/tap/qratum` installs the `qrt` binary.
# Requires HOMEBREW_TAP_TOKEN (a token with write access to
# acartag7/homebrew-tap) in the release workflow environment.
#
# Note: goreleaser warns that `brews` is being phased out in favor of
# `homebrew_casks`. A formula is a deliberate choice here: it works on Linuxbrew
# (casks are macOS-only) and avoids macOS Gatekeeper quarantine friction for a
# CLI binary. Revisit if `brews` is removed in a future goreleaser major.
brews:
  - name: qratum
    repository:
      owner: acartag7
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://qratum.dev"
    description: "The local librarian for your AI coding sessions — a local-first vault and refinery."
    license: "MIT"
    install: |
      bin.install "qrt"
    test: |
      system "#{bin}/qrt", "--version"
