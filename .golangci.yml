version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  exclusions:
    # Qratum is currently a single CLI package that reads and writes local files.
    # Keep structural linters on, but avoid noisy CLI-only errcheck/gosec reports
    # until shared internal packages exist.
    rules:
      - path: cmd/qrt/
        linters:
          - errcheck
          - gosec
      - path: cmd/qrt/
        text: "package-comments:"
        linters:
          - revive
      # TODO(go-readiness): re-enable revive redefines-builtin-id after renaming
      # the `max` param in cmd/qrt/dogfood.go (writeDogfoodFindingsList,
      # writeDogfoodEvidenceList) so it no longer shadows Go 1.21's builtin
      # max(). Disabled temporarily to unblock the landing pipeline while the Go
      # runtime is not ready. See #2.
      - path: cmd/qrt/dogfood.go
        text: "redefines-builtin-id"
        linters:
          - revive
      - path: cmd/qrt/normalize.go
        linters:
          - nilerr
      - path: _test\.go
        linters:
          - errcheck
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - ineffassign
    - unused
    - misspell
    - revive
    - unconvert
    - gocritic
    - nilerr
    - errorlint
    - copyloopvar

linters-settings:
  gosec:
    severity: high
    confidence: medium
  revive:
    rules:
      - name: exported
        arguments:
          - checkPrivateReceivers
      - name: unexported-return
      - name: error-return
      - name: error-naming
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam

issues:
  max-issues-per-linter: 50
  max-same-issues: 5
