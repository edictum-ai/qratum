name: Landing

# Independent pipeline for the Qratum landing page (design/landing-drafts).
# It is deliberately separate from the Go runtime CI (.github/workflows/ci.yml):
# this only runs when the landing changes, and it does not touch the qrt binary,
# Go modules, or the qratum runtime supply chain.
#
# Delivery: Vercel deploys via its own git integration (connect the repo, set
# Root Directory = design/landing-drafts). This workflow is the build/quality
# gate that must pass before Vercel ships. Deploy is intentionally NOT done
# here — keeping a Vercel token and a third-party deploy action out of CI is the
# lower-risk choice for a security-sensitive repo.

on:
  push:
    branches: [main]
    paths:
      - 'design/landing-drafts/**'
      - '.github/workflows/landing.yml'
  pull_request:
    branches: [main]
    paths:
      - 'design/landing-drafts/**'
      - '.github/workflows/landing.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: design/landing-drafts

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.11.0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '20.18.0'
          cache: 'pnpm'
          cache-dependency-path: 'design/landing-drafts/pnpm-lock.yaml'
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
