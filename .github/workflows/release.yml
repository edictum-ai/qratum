name: release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - "scripts/homebrew-smoke.sh"
      - "cmd/qrt/**"
  workflow_dispatch:

permissions: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Supply-chain policy
        run: sh scripts/check-supply-chain.sh

  # Build all targets and Homebrew formula in snapshot mode (no publish, no
  # token) and smoke the host binary. Runs on PRs touching the release plumbing
  # so config breakage is caught before a tag is cut.
  dry-run:
    needs: gate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          HOMEBREW_TAP_TOKEN: snapshot
      - name: Homebrew smoke (snapshot binary)
        run: sh scripts/homebrew-smoke.sh

  # Real release on a v* tag: publish the GitHub release and push the formula to
  # acartag7/homebrew-tap. HOMEBREW_TAP_TOKEN must be a repo secret with
  # write access to the tap.
  release:
    needs: gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
